<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 600" font-family="'Noto Sans CJK TC','Noto Sans TC','WenQuanYi Zen Hei','PingFang TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a52a3a"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #8f1d2c; stroke-width: 2; }
    .tint { fill: #faf1f2; }
    .title { font-size: 20px; font-weight: bold; fill: #7d1726; }
    .role { font-size: 15px; fill: #4b5563; }
    .file { font-family: 'Noto Sans Mono CJK TC', 'SF Mono', Consolas, 'WenQuanYi Zen Hei Mono', 'Courier New', monospace; font-size: 13px; fill: #a52a3a; }
    .lbl { font-size: 14px; fill: #4b5563; }
    .flow { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arr); }
    .flow2 { stroke: #6b7280; stroke-width: 2; fill: none; marker-end: url(#arr); marker-start: url(#arr); }
    .flowR { stroke: #a52a3a; stroke-width: 2.5; fill: none; marker-end: url(#arrR); }
    .note { font-size: 15px; fill: #6b7280; }
  </style>

  <!-- Browser -->
  <rect class="box tint" x="480" y="20" width="220" height="58" rx="29"/>
  <text class="title" x="590" y="50" text-anchor="middle" font-size="18">瀏覽器</text>
  <text class="lbl" x="590" y="68" text-anchor="middle" font-size="12">送出 request、顯示 HTML</text>

  <line class="flow" x1="590" y1="78" x2="590" y2="126"/>
  <text class="lbl" x="604" y="106">HTTP</text>

  <!-- URLs -->
  <rect class="box" x="340" y="130" width="500" height="62" rx="10"/>
  <text class="title" x="590" y="158" text-anchor="middle" font-size="17">URLs 分派</text>
  <text class="file" x="590" y="180" text-anchor="middle">config/urls.py → marketplace/urls.py</text>

  <line class="flow" x1="590" y1="192" x2="590" y2="240"/>
  <text class="lbl" x="604" y="222">比對成功才呼叫</text>

  <!-- View -->
  <rect class="box" x="340" y="244" width="500" height="96" rx="10"/>
  <text class="title" x="590" y="280" text-anchor="middle">View：控制流程的廚師</text>
  <text class="role" x="590" y="304" text-anchor="middle">讀 request → 決定查什麼資料 → 準備 context → 選模板</text>
  <text class="file" x="590" y="327" text-anchor="middle">marketplace/views.py</text>

  <!-- Model (left) -->
  <rect class="box" x="40" y="226" width="220" height="130" rx="10"/>
  <text class="title" x="150" y="262" text-anchor="middle" font-size="18">Model</text>
  <text class="role" x="150" y="286" text-anchor="middle">資料結構與商業規則</text>
  <text class="role" x="150" y="308" text-anchor="middle">欄位、關聯、驗證</text>
  <text class="file" x="150" y="334" text-anchor="middle">marketplace/models.py</text>

  <line class="flow2" x1="264" y1="291" x2="336" y2="291"/>
  <text class="lbl" x="300" y="280" text-anchor="middle">ORM</text>

  <!-- DB under Model -->
  <ellipse cx="150" cy="448" rx="110" ry="16" fill="#faf1f2" stroke="#8f1d2c" stroke-width="2"/>
  <rect x="40" y="448" width="220" height="64" fill="#faf1f2" stroke="#8f1d2c" stroke-width="2"/>
  <rect x="40" y="448" width="220" height="34" fill="#faf1f2"/>
  <ellipse cx="150" cy="512" rx="110" ry="16" fill="#faf1f2" stroke="#8f1d2c" stroke-width="2"/>
  <line x1="40" y1="448" x2="40" y2="512" stroke="#8f1d2c" stroke-width="2"/>
  <line x1="260" y1="448" x2="260" y2="512" stroke="#8f1d2c" stroke-width="2"/>
  <text class="title" x="150" y="484" text-anchor="middle" font-size="16">SQLite</text>

  <line class="flow2" x1="150" y1="360" x2="150" y2="430"/>
  <text class="lbl" x="164" y="400">SQL</text>

  <!-- Template (right) -->
  <rect class="box" x="920" y="226" width="220" height="130" rx="10"/>
  <text class="title" x="1030" y="262" text-anchor="middle" font-size="18">Template</text>
  <text class="role" x="1030" y="286" text-anchor="middle">只負責畫面版型</text>
  <text class="role" x="1030" y="308" text-anchor="middle">{{ 變數 }}　{% 標籤 %}</text>
  <text class="file" x="1030" y="334" text-anchor="middle">templates/…/*.html</text>

  <line class="flow" x1="844" y1="278" x2="916" y2="278"/>
  <text class="lbl" x="880" y="268" text-anchor="middle">context</text>

  <!-- HTML back to browser -->
  <path class="flowR" d="M 1030 226 V 49 H 706"/>
  <text class="lbl" x="1044" y="140" fill="#a52a3a">合成後的</text>
  <text class="lbl" x="1044" y="160" fill="#a52a3a">HTML response</text>

  <!-- MVC note -->
  <rect x="40" y="540" width="1100" height="44" rx="8" fill="#fdf7f8" stroke="#d69aa3" stroke-width="1.5"/>
  <text class="note" x="590" y="567" text-anchor="middle">名詞對照：Django 的「View」相當於 MVC 的 Controller；Django 的「Template」相當於 MVC 的 View。本課程一律用 Django 的用法。</text>
</svg>
