name: Curriculum links

on:
  push:
    paths:
      - "**/*.md"
      - "tools/check_curriculum_links.py"
      - ".github/workflows/curriculum-links.yml"
  pull_request:
    paths:
      - "**/*.md"
      - "tools/check_curriculum_links.py"
      - ".github/workflows/curriculum-links.yml"

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate curriculum links
        run: python tools/check_curriculum_links.py
