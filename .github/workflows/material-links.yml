name: Teaching material links

on:
  push:
    branches:
      - master
      - "chatgpt/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Check repository-local Markdown links
        run: python scripts/check_material_links.py
      - name: Check teaching version baseline
        run: python scripts/check_version_baseline.py
