name: Upgrade teaching refs to Django 6.1 (ChatGPT)

on:
  push:
    branches:
      - "chatgpt/curriculum-audit-2026-09-16"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade:
    if: github.event.head_commit.message != 'docs: upgrade teaching references to Django 6.1 and Python 3.14 (ChatGPT)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/curriculum-audit-2026-09-16
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Upgrade current-version references
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          suffixes = {'.md', '.py', '.toml', '.yml', '.yaml', '.txt'}
          replacements = [
              ('https://docs.djangoproject.com/en/5.2/', 'https://docs.djangoproject.com/en/6.1/'),
              ('django>=5.2,<5.3', 'django>=6.1.1,<6.2'),
              ('Django 5.2 LTS', 'Django 6.1.1'),
              ('Django 5.2 系列', 'Django 6.1 系列'),
              ('Django 5.2', 'Django 6.1'),
              ('Python 3.13', 'Python 3.14.7'),
              ('Python 應符合 3.13 以上；Django 應在 5.2.x 範圍。', 'Python 應使用 3.14.x；Django 應在 6.1.x 範圍。'),
              ('requires-python = ">=3.13"', 'requires-python = ">=3.14,<3.15"'),
              ('python-version: "3.13"', 'python-version: "3.14.7"'),
              ("python-version: '3.13'", "python-version: '3.14.7'"),
          ]

          changed = []
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in suffixes:
                  continue
              if '.git' in path.parts or 'migrations' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text
              for old, repl in replacements:
                  new = new.replace(old, repl)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))
          print('Updated files:')
          for item in changed:
              print('-', item)
          PY
      - name: Commit upgraded references
        run: |
          if git diff --quiet; then
            echo "No current-version references needed replacement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: upgrade teaching references to Django 6.1 and Python 3.14 (ChatGPT)"
          git push origin HEAD:chatgpt/curriculum-audit-2026-09-16
