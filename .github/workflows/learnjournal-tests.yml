name: Django project checks

on:
  push:
    branches:
      - master
      - "chatgpt/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  django:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Apply one-off Django 6.1 workbook correction
        if: github.ref == 'refs/heads/master' && hashFiles('scripts/fix_django61_workbook_ranges.py') != ''
        run: python scripts/fix_django61_workbook_ranges.py
      - name: Verify runtime versions and Django projects
        run: |
          set -e
          for project in learnboard learnmart learnjournal; do
            echo "===== $project ====="
            cd "$project"
            uv sync --frozen
            uv run python --version
            uv run python -m django --version
            uv run python manage.py check
            uv run python manage.py makemigrations --check
            uv run python manage.py test
            cd ..
          done
      - name: Commit one-off workbook correction
        if: github.ref == 'refs/heads/master' && hashFiles('scripts/fix_django61_workbook_ranges.py') == ''
        run: |
          if git diff --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: correct Django 6.1 dependency range explanations (ChatGPT)"
          git push origin HEAD:master
