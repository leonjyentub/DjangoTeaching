name: Refresh uv locks (ChatGPT branch)

on:
  push:
    branches:
      - "chatgpt/curriculum-audit-2026-09-16"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message != 'chore: refresh uv locks for Django 6.1 (ChatGPT)'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chatgpt/curriculum-audit-2026-09-16
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.7"
      - name: Refresh lock files
        run: |
          for project in learnboard learnmart learnjournal; do
            (cd "$project" && uv lock --upgrade)
          done
      - name: Commit refreshed locks
        run: |
          if git diff --quiet -- learnboard/uv.lock learnmart/uv.lock learnjournal/uv.lock; then
            echo "Lock files already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add learnboard/uv.lock learnmart/uv.lock learnjournal/uv.lock
          git commit -m "chore: refresh uv locks for Django 6.1 (ChatGPT)"
          git push origin HEAD:chatgpt/curriculum-audit-2026-09-16
