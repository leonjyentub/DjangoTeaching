{% extends "base.html" %}
{% block title %}設定新密碼 · LearnJournal{% endblock %}
{% block content %}
<h1 class="h3 mb-3">設定新密碼</h1>
{% if validlink %}
<form method="post" class="col-md-8">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">更新密碼</button>
</form>
{% else %}
<div class="alert alert-warning">這個重設連結無效或已使用，請重新申請。</div>
<a href="{% url 'password_reset' %}">重新申請重設連結</a>
{% endif %}
{% endblock %}
