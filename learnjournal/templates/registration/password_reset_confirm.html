{% extends 'base.html' %}
{% block title %}設定新密碼 · LearnJournal{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
  <h1 class="h4">設定新密碼</h1>
  {% if validlink %}
    <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">更新密碼</button></form>
  {% else %}
    <div class="alert alert-danger">這個重設連結無效或已使用，請重新申請。</div>
  {% endif %}
</div></div>
{% endblock %}
