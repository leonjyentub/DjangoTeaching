{% extends "base.html" %}
{% block title %}重設密碼 · LearnJournal{% endblock %}
{% block content %}
<h1 class="h3 mb-3">忘記密碼</h1>
<p class="text-secondary">輸入註冊 email。開發環境會把重設信印在啟動伺服器的終端機。</p>
<form method="post" class="col-md-8">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn btn-primary">寄出重設信</button>
</form>
{% endblock %}
