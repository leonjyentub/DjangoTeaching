{% extends 'base.html' %}
{% block title %}重設密碼 · LearnJournal{% endblock %}
{% block content %}
<div class="card shadow-sm"><div class="card-body">
  <h1 class="h4">忘記密碼</h1>
  <p class="text-secondary">輸入註冊 email。開發環境會把重設信印在終端機。</p>
  <form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary">寄出重設信</button></form>
</div></div>
{% endblock %}
