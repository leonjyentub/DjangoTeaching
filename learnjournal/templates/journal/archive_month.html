{% extends "base.html" %}
{% block content %}
  <h1 class="h3 mb-3">{{ month|date:"Y 年 n 月" }}的文章</h1>
  {% for article in articles %}
    {% include "journal/_article_card.html" %}
  {% empty %}
    <p class="text-secondary">這個月沒有文章。</p>
  {% endfor %}
  <p class="small">
    {% if previous_month %}<a href="{% url 'journal:archive-month' previous_month|date:'Y' previous_month|date:'n' %}">← 上個月</a>{% endif %}
    {% if next_month %} · <a href="{% url 'journal:archive-month' next_month|date:'Y' next_month|date:'n' %}">下個月 →</a>{% endif %}
  </p>
{% endblock %}
