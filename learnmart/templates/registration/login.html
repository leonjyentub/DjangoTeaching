{% extends "base.html" %}{% block title %}登入｜學購{% endblock %}{% block content %}<div class="auth-card card border-0 shadow-sm mx-auto"><div class="card-body p-4 p-md-5"><h1 class="h3 mb-4">登入學購</h1><form method="post">{% csrf_token %}<p><label for="id_username">帳號</label><input class="form-control" type="text" name="username" autofocus autocomplete="username" maxlength="150" required id="id_username"></p><p><label for="id_password">密碼</label><input class="form-control" type="password" name="password" autocomplete="current-password" required id="id_password"></p>{% if form.errors %}<div class="alert alert-danger">帳號或密碼不正確，請再試一次。</div>{% endif %}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="btn btn-danger w-100">登入</button></form><p class="mt-3 mb-0 text-center">還沒有帳號？<a href="{% url 'marketplace:register' %}">立即註冊</a></p></div></div>{% endblock %}
