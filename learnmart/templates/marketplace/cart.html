{% extends "base.html" %}{% block content %}<h1 class="h2 mb-4">購物車</h1>{% for item in items %}<div class="card border-0 shadow-sm mb-3"><div class="card-body d-flex flex-column flex-md-row align-items-md-center gap-3"><div class="flex-grow-1"><a class="h5 text-decoration-none text-dark" href="{{ item.product.get_absolute_url }}">{{ item.product.name }}</a><div class="text-secondary">單價 NT$ {{ item.product.price }} · 小計 NT$ {{ item.subtotal }}</div></div><form method="post" action="{% url 'marketplace:update-cart' item.pk %}" class="d-flex gap-2">{% csrf_token %}<input class="form-control cart-quantity" type="number" name="quantity" min="0" max="{{ item.product.stock }}" value="{{ item.quantity }}"><button class="btn btn-outline-dark">更新</button></form><form method="post" action="{% url 'marketplace:remove-from-cart' item.pk %}">{% csrf_token %}<button class="btn btn-outline-danger">移除</button></form></div></div>{% empty %}<div class="alert alert-light border py-5 text-center">購物車是空的，<a href="{% url 'marketplace:home' %}">去逛逛商品</a>。</div>{% endfor %}{% if items %}<div class="d-flex justify-content-end align-items-center gap-4 mt-4"><div class="fs-4">合計 <strong class="price">NT$ {{ total }}</strong></div><a class="btn btn-danger btn-lg" href="{% url 'marketplace:checkout' %}">前往結帳</a></div>{% endif %}{% endblock %}
