{% extends "base.html" %}{% block content %}<div class="row g-4"><div class="col-lg-7"><h1 class="h2">填寫收件資料</h1><form method="post" class="card border-0 shadow-sm"><div class="card-body p-4">{% csrf_token %}{{ form.as_p }}<button class="btn btn-danger btn-lg w-100">確認下單</button></div></form></div><aside class="col-lg-5"><h2 class="h4">訂單摘要</h2><div class="list-group">{% for item in items %}<div class="list-group-item d-flex justify-content-between"><span>{{ item.product.name }} × {{ item.quantity }}</span><span>NT$ {{ item.subtotal }}</span></div>{% endfor %}</div></aside></div>{% endblock %}
