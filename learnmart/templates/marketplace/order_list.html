{% extends "base.html" %}{% block content %}<h1 class="h2 mb-4">我的訂單</h1><div class="row g-3">{% for order in orders %}<div class="col-12"><a class="card border-0 shadow-sm text-decoration-none text-dark" href="{% url 'marketplace:order-detail' order.pk %}"><div class="card-body d-flex flex-wrap justify-content-between gap-2"><div><strong>訂單 #{{ order.pk }}</strong><div class="small text-secondary">{{ order.created_at|date:"Y/m/d H:i" }} · {{ order.items.count }} 項商品</div></div><div class="text-end"><span class="badge text-bg-info">{{ order.get_status_display }}</span><div class="price fw-bold mt-1">NT$ {{ order.total }}</div></div></div></a></div>{% empty %}<p>還沒有訂單。</p>{% endfor %}</div>{% endblock %}
